short_bio: >-
  <p>
    I am a first-year PhD student in Bioinformatics at Shanghai Jiao Tong University. My research focuses on applying artificial intelligence to the design and optimization of proteins, enzymes, and antibodies.
  </p>
  <p>
    I used to be a dedicated distance runner, with a personal best of 19 minutes for the 5K. I completed my first half-marathon in Shangyu, Shaoxing. More recently, I have developed a strong interest in strength training—especially deadlifts.
  </p>
  <p>
    Outside of research and training, I enjoy spending time outdoors and connecting with people. I also have a cat named Panghu (胖虎), who brings plenty of fun to my everyday life.
  </p>

